---
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-xml
  - id: check-yaml
    args: [ '--allow-multiple-documents', '--unsafe' ]
    exclude: |
      (?x)^(
          .*/templates/.*.yaml|
          .*.template.yaml
      )$
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    exclude: |
      (?x)^(
        .*/package-lock.json|
        .*.(png|jpg|ico)
      )$
  - id: check-case-conflict
  - id: detect-aws-credentials
    args: [ '--allow-missing-credentials' ]
  - id: detect-private-key
  - id: check-executables-have-shebangs
- repo: https://github.com/gruntwork-io/pre-commit
  rev: v0.1.30
  hooks:
  - id: tofu-fmt
  - id: tofu-validate
    # aws-network-setup cannot be validated standalone: its module needs aws provider with for_each (alias by_region)
    exclude: |
      (?x)^(
        terraform/aws/aws-network-setup/.*|
        .*\.terraform/.*|
        .*\.terragrunt-cache/.*
      )$
  - id: terragrunt-hcl-fmt
  - id: helmlint
  - id: gofmt
  - id: goimports
  - id: packer-validate
  - id: tflint
    args:
    - --config=__GIT_ROOT__/.tflint.hcl
    # aws-network-setup module uses OpenTofu provider for_each, which tflint cannot parse (same limitation as for tofu-validate)
    exclude: |
      (?x)^(
        terraform/aws/aws-network-setup/.*|
        .*\.terraform/.*|
        .*\.terragrunt-cache/.*
      )$
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.109.2
  hooks:
  - id: terraform_trivy
    args:
    - --args=-s=CRITICAL
    - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore.yaml
  - id: terraform_fmt
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: forbid-binary
    exclude: |
      (?x)^(
        .*.(png|jpg|ico)
      )$
  - id: git-check
  - id: markdownlint
  - id: require-ascii
    exclude: |
      (?x)^(
        .*.(lock)
      )$
  - id: shellcheck
  - id: shfmt
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    entry: yamllint --strict
- repo: local
  hooks:
  - id: markdown-link-check
    name: markdown-link-check
    description: |
      Checks relative and absolute links in Markdown files.
      Local hook (instead of gruntwork-io markdown-link-check) because the gruntwork one generates its own config
      and cannot be customized.
    entry: bash -c 'for f in "$@"; do markdown-link-check -q -c .markdown-link-check.json --projectBaseUrl "$PWD" "$f" || rc=1; done; exit ${rc:-0}' --
    language: system
    files: \.md$
    exclude: vendor\/.*$
  - id: golangci-lint
    name: golangci-lint (go/learning)
    description: |
      Runs golangci-lint (config: go/learning/.golangci.yml) on the go/learning module.
      Local hook, because go/learning is a nested module: neither gruntwork-io nor golangci-lint hooks
      work from the repository root, which has no go.mod.
    entry: bash -c 'cd go/learning && golangci-lint run ./...'
    language: system
    files: ^go/learning/.*(\.go|go\.mod|\.golangci\.yml)$
    pass_filenames: false
  - id: ansible-lint
    name: Ansible-lint
    description: |
      This hook runs ansible-lint on selected ansible playbooks and roles.
      Do not use https://github.com/ansible/ansible-lint.git default pre-commit b/c its autodetect feature
      does not correctly detect plays and roles and it always traverse entire subdirectory
    entry: ansible-lint --force-color
    language: python
    pass_filenames: true
    always_run: false
    files: |
      (?x)^(
          ansible\/[^/]*\/[^/]*yaml|
          ansible/.*/roles/.*/tasks/.*(yaml|yml)|
          k8s/(jenkins|istio)/(deploy|ensure|roles/.*/tasks).*.(yaml|yml)
      )$
    exclude: |
      (?x)^(
          .*/templates/.*.yaml|
          .*.template.yaml
      )$
    additional_dependencies:
    - .[community,yamllint]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff # python linter
    args: [ --fix ]
  - id: ruff-format # python formatter
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/cpplint/cpplint
  rev: 2.0.2
  hooks:
  - id: cpplint
