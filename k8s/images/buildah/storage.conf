# Container storage configuration for the buildah images (same settings as in quay.io/buildah/stable)
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# shared, read-only image store, can be pre-populated and mounted into the container
additionalimagestores = [
  "/var/lib/shared",
]

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
