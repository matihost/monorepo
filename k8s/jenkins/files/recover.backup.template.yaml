---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: "{{ jenkins_namespace }}-jenkins-backup-recover"
  name: "{{ jenkins_recover_job_name }}"
  namespace: "{{ jenkins_namespace }}"
spec:
  template:
    metadata:
      labels:
        app: "{{ jenkins_namespace }}-jenkins-backup-recover"
        # to prevent injecting istio sidecar as it prevents job from completion
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: "{{ jenkins_namespace }}-jenkins"
      containers:
      - name: jenkins-backup-recover
        image: maorfr/skbn
        command: ["skbn"]
        args:
        - "cp"
        - "--src"
        - "gcs://{{ gcp_project }}-{{ jenkins_namespace }}-jenkins-server-data/jenkins-backup/{{ backup_id }}"
        - "--dst"
        - "k8s://{{ jenkins_namespace }}/{{ jenkins_namespace }}-jenkins-0/jenkins/var/jenkins_home/jobs"
        imagePullPolicy: IfNotPresent
