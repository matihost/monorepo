---
apiVersion: v1
kind: Namespace
metadata:
  name: "{{ jenkins_namespace }}"
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci
  namespace: "{{ jenkins_namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci
  namespace: "{{ jenkins_namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: ci
  namespace: "{{ jenkins_namespace }}"
- kind: ServiceAccount
  name: "{{ jenkins_namespace }}-jenkins"
  namespace: "{{ jenkins_namespace }}"
