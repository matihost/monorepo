all:
  hosts:
    localhost:
  vars:
    istio:
      hub: "docker.io/istio"
      version: "1.31.3"
      istiod:
        minReplicas: 1
        maxReplicas: 1
    ingress_class:
      enable: true
      default: false
    ingress_gateway:
      default_dns_suffix: internal.minikube
    egress_gateway:
      enable: true
